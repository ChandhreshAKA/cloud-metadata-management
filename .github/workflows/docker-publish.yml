name: Publish Docker images

# Builds the API and dashboard images and pushes them to Docker Hub when main changes
# (or when started by hand from the Actions tab).
# One-time setup: GitHub repo -> Settings -> Secrets and variables -> Actions:
#   DOCKERHUB_USERNAME   your Docker Hub user name
#   DOCKERHUB_TOKEN      a Docker Hub access token (Account settings -> Security), NOT your password
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-metadata-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-metadata-api:${{ github.sha }}

      - name: Build and push the dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-metadata-dashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-metadata-dashboard:${{ github.sha }}
